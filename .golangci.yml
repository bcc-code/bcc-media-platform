version: "2"

# Lint config for the Go backend.
#
# CI runs this with --new-from-rev so only newly written code is gated; the
# existing findings are tracked separately and this will be switched to a
# full-tree run once they are cleared.

linters:
  default: standard
  enable:
    # Resource leaks and error handling — the classes of bug that have actually
    # bitten us (unclosed response bodies, unchecked rows.Err, errors turned
    # into empty results).
    - bodyclose
    - rowserrcheck
    - nilerr
    # Dead assignments and redundant Go 1.22+ loop-variable copies.
    - copyloopvar
    - unparam

  settings:
    govet:
      disable:
        # Reports "cannot inline: type parameter inference is not yet supported"
        # on ordinary generic calls. Advisory only, and not actionable.
        - inline

    staticcheck:
      # Style and quick-fix checks are disabled for now so the real findings
      # aren't buried in cosmetics. Drop the exclusions once the backlog in
      # the investigation report is cleared.
      checks:
        - all
        - -ST1005 # capitalized error strings
        - -QF1004 # strings.Replace(..., -1) -> strings.ReplaceAll
        - -QF1008 # redundant embedded field in selector

  exclusions:
    # Every generated file in the tree (gqlgen, sqlc, mockery) carries the
    # canonical "Code generated by ... DO NOT EDIT." header, so this is
    # sufficient — no explicit path list needed.
    generated: strict
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may ignore errors on fixture setup and use plain string context
      # keys to mirror what the middleware does.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # Local developer tooling, not shipped in a service image.
      - path: ^backend/cmd/(tools|staging-sync|sign-url|rewriter)/
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
