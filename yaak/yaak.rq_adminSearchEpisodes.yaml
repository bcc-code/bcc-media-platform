type: http_request
model: http_request
id: rq_adminSearchEpisodes
createdAt: 2026-10-19T00:00:00
updatedAt: 2026-10-19T00:00:00
workspaceId: wk_hGg2sqajat
folderId: fl_adminApiKey
authentication: {}
authenticationType: none
body:
  operationName: AdminSearch
  query: |-
    query AdminSearch($query: String!, $filter: SearchFilter, $first: Int, $offset: Int) {
      search {
        query(query: $query, filter: $filter, first: $first, offset: $offset) {
          total
          # Set when the key's grant forces a usergroup.
          group
          hits {
            id
            type
            score
            item {
              ... on Episode {
                title
                status
                duration
                season {
                  number
                  show {
                    title
                  }
                }
              }
              ... on Season {
                title
                number
                show {
                  title
                }
              }
              ... on Show {
                title
                status
              }
            }
          }
        }
      }
    }
  variables: |-
    {
      "query": "bibel",
      "filter": {
        "types": ["episode"]
      },
      "first": 10,
      "offset": 0
    }
bodyType: graphql
description: Same search narrowed to episodes. If the key's grant also limits types, only the overlap is searched.
headers:
- enabled: true
  name: Content-Type
  value: application/json
  id: h_ct_rq_adminSearchEpisodes
- enabled: true
  name: x-api-key
  value: ${[ ADMIN_API_KEY ]}
  id: h_key_rq_adminSearchEpisodes
method: POST
name: Search episodes only (API key)
sortPriority: 2.0
url: ${[ ADMIN_API_URL ]}/admin
urlParameters: []
settingSendCookies:
  enabled: false
  value: true
settingStoreCookies:
  enabled: false
  value: true
settingValidateCertificates:
  enabled: false
  value: true
settingFollowRedirects:
  enabled: false
  value: true
settingRequestTimeout:
  enabled: false
  value: 0
