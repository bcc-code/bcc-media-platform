body:
  operationName: Live
  query: |-
    # Live state plus, when online and the caller's roles allow it, a signed
    # manifest URL (with the MediaPackage start tag when an entry is in progress).
    query Live {
      live {
        isOnline
        url
        expiresAt
      }
      me{
        roles
      }
    }
bodyType: graphql
