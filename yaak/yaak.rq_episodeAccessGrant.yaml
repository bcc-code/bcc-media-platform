folderId: fl_adminApiKey
authentication:
  disabled: false
  key: x-api-key
  value: ${[ ADMIN_API_KEY ]}
authenticationType: apikey
body:
  operationName: GrantEpisodeAccess
  query: |-
    mutation GrantEpisodeAccess($input: EpisodeAccessInput!) {
      episodeAccess {
        grant(input: $input) {
          roles {
            access
            download
            earlyAccess
          }
          episodes {
            id
            title
          }
        }
      }
    }
  variables: |-
    {
      "input": {
        "episodeId": "1",
        "groups": ["public"],
        "lists": ["access"]
      }
    }
bodyType: graphql
description: |-
  Adds the groups to the episode's media item, for each list (access, download, earlyAccess).
  Affects every episode sharing the media item. Groups outside the key's allowlist are FORBIDDEN;
  a missing auto group (e.g. <app>-public) is created. Needs an episodeAccess write grant.
