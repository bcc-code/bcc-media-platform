type: http_request
model: http_request
id: rq_episodeAccessRevoke
createdAt: 2026-10-20T00:00:00
updatedAt: 2026-10-20T00:00:00
workspaceId: wk_hGg2sqajat
folderId: fl_adminApiKey
authentication:
  disabled: false
  key: x-api-key
  value: ${[ ADMIN_API_KEY ]}
authenticationType: apikey
body:
  operationName: RevokeEpisodeAccess
  query: |-
    mutation RevokeEpisodeAccess($input: EpisodeAccessInput!) {
      episodeAccess {
        revoke(input: $input) {
          roles {
            access
            download
            earlyAccess
          }
          episodes {
            id
            title
          }
        }
      }
    }
  variables: |-
    {
      "input": {
        "episodeId": "1",
        "groups": ["public"],
        "lists": ["access"]
      }
    }
bodyType: graphql
description: |-
  Removes the groups from the episode's media item, for each list. Groups not there are ignored.
  Needs an episodeAccess write grant.
headers:
- enabled: true
  name: Content-Type
  value: application/json
  id: h_ct_rq_episodeAccessRevoke
name: Revoke episode access (API key)
sortPriority: 5.0
method: POST
url: ${[ ADMIN_API_URL ]}/admin
urlParameters: []
